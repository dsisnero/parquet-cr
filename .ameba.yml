# Ameba configuration for parquet-cr
Version: "1.7.0-dev"

Excluded:
  - temp/**/*
  - lib/**/*
  - vendor/**/*
  - spec/**/*

# Faithfully ported upstream builder/config types keep their Rust `set_*`/
# non-`?` boolean accessor names. These files hold many such methods, so the
# naming rules are excluded at the file level rather than per method.
Naming/AccessorMethodName:
  Excluded:
    - src/parquet/file/properties.cr
    - src/parquet/compression.cr
    - src/parquet/column/writer/writer.cr
    - src/parquet/file/reader.cr

Naming/QueryBoolMethods:
  Excluded:
    - src/parquet/file/properties.cr
    - src/parquet/compression.cr
    - src/parquet/file/reader.cr

# The column writer is a large, direct port; its upstream `not_nil!`-equivalent
# unwraps and cyclic control flow are kept as-is. The serialized file/row-group
# writers are likewise direct ports.
Lint/NotNil:
  Excluded:
    - src/parquet/column/writer/writer.cr
    - src/parquet/file/writer.cr

Lint/ShadowingOuterLocalVar:
  Excluded:
    - src/parquet/column/writer/writer.cr

Metrics/CyclomaticComplexity:
  Excluded:
    - src/parquet/column/writer/writer.cr
