# Ameba configuration for parquet-cr
Version: "1.7.0-dev"

Excluded:
  - temp/**/*
  - lib/**/*
  - vendor/**/*
  - spec/**/*

# Faithfully ported upstream builder/config types keep their Rust `set_*`/
# non-`?` boolean accessor names. These files hold many such methods, so the
# naming rules are excluded at the file level rather than per method.
Naming/AccessorMethodName:
  Excluded:
    - src/parquet/file/properties.cr
    - src/parquet/compression.cr
    - src/parquet/column/writer/writer.cr
    - src/parquet/file/reader.cr
    - src/parquet/record/api.cr

Naming/QueryBoolMethods:
  Excluded:
    - src/parquet/file/properties.cr
    - src/parquet/compression.cr
    - src/parquet/file/reader.cr
    - src/parquet/record/api.cr
    - src/parquet_variant/variant/metadata.cr
    - src/parquet/file/metadata/column_chunk.cr

# The variant value types keep the upstream `is_fully_validated` accessor name
# (with a Crystal-idiomatic `fully_validated?` alias alongside it). The core
# geospatial accumulator keeps the upstream `GeoStatsAccumulator` trait method
# name `is_valid` (the ported `BoundingBox` predicates mark their own lines and
# do not need this exclusion).
Naming/PredicateName:
  Excluded:
    - src/parquet_variant/variant.cr
    - src/parquet_variant/variant/object.cr
    - src/parquet_variant/variant/list.cr
    - src/parquet/geospatial/accumulator.cr

# The column writer is a large, direct port; its upstream `not_nil!`-equivalent
# unwraps and cyclic control flow are kept as-is. The serialized file/row-group
# writers are likewise direct ports.
Lint/NotNil:
  Excluded:
    - src/parquet/column/writer/writer.cr
    - src/parquet/file/writer.cr

Lint/ShadowingOuterLocalVar:
  Excluded:
    - src/parquet/column/writer/writer.cr

# `apply_hint`/`from_int64` are direct ports of upstream's large `match`es
# (every parquet/arrow type pair), so the complexity budget does not apply.
Metrics/CyclomaticComplexity:
  Excluded:
    - src/parquet/arrow/schema/primitive.cr
    - src/parquet/arrow/row_selection/algebra.cr
    - src/parquet/arrow/read_plan.cr
    - src/parquet/arrow/statistics.cr
    - src/parquet/column/writer/writer.cr
    - src/parquet_variant/variant.cr
    - src/parquet_variant/variant/debug.cr
    - src/parquet_variant/builder/state.cr
    - src/parquet/file/metadata/column_chunk.cr
    - src/parquet/file/metadata/thrift/encryption.cr
